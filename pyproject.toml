[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amyclip"
version = "0.1.0"
description = "Final AMYCLIP architecture, training objective, and checkpoint inference"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "fair-esm==2.0.0",
  "numpy>=1.24",
  "pandas>=2.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
